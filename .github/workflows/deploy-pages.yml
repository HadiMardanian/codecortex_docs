name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel outdated queued runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enables Pages if it isn't enabled yet
          enablement: true

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          # Publishes everything in /public — no build step needed.
          # Change this path if your static files live elsewhere (e.g. '.' for repo root).
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
